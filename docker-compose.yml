# Configuração comum dos três WordPress (evita repetição)
x-wordpress: &wordpress
  image: wordpress:5.4.2-php7.2-apache
  restart: always
  depends_on:
    mysql:
      condition: service_healthy
  environment:
    WORDPRESS_DB_HOST: mysql:3306
    WORDPRESS_DB_USER: wordpress
    WORDPRESS_DB_PASSWORD: wordpress
    WORDPRESS_DB_NAME: wordpress
  volumes:
    - ./wordpress:/var/www/html

services:
  # Sem "ports": só os WordPress alcançam o banco pela rede interna.
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sem "ports": só o Nginx alcança os WordPress.
  wordpress1:
    <<: *wordpress
    container_name: wordpress1

  wordpress2:
    <<: *wordpress
    container_name: wordpress2

  wordpress3:
    <<: *wordpress
    container_name: wordpress3

  # Único serviço exposto ao hospedeiro.
  nginx:
    image: nginx:1.19.0
    container_name: nginx
    restart: always
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./wordpress:/usr/share/nginx/html

volumes:
  db_data: